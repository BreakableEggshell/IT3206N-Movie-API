<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Collection</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 30px 16px;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 30px;
    }
    h1 { text-align: center; font-size: 38px; margin: 40px 0 20px; }
    h2 { font-size: 30px; margin: 20px 0; }
    form { display: flex; flex-wrap: wrap; gap: 18px; padding: 0 6px; }
    input {
      width: 200px;
      padding: 14px;
      border: 1px solid #999;
      font-size: 15px;
    }
    button {
      padding: 14px;
      border: 1px solid #999;
      background: #efefef;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #e2e2e2; }
    #message { font-weight: bold; margin: 16px 0 0; min-height: 20px; }
    #message.error { color: #c00; }
    #load-btn { margin: 20px 6px 30px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 14px; border: 1px solid #ddd; }
    th { background: #eee; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Movie Collection</h1>

    <h2>Add Movie</h2>
    <form id="movie-form">
      <input id="title" placeholder="Title" required>
      <input id="genre" placeholder="Genre" required>
      <input id="year" type="number" placeholder="Year" required>
      <button type="submit">Add Movie</button>
    </form>
    <p id="message"></p>

    <h2>Movies</h2>
    <button id="load-btn" type="button">Load Movies</button>

    <table>
      <thead>
        <tr><th>ID</th><th>Title</th><th>Genre</th><th>Year</th></tr>
      </thead>
      <tbody id="movie-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('movie-form');
    const body = document.getElementById('movie-body');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? 'error' : '';
    }

    async function loadMovies() {
      const res = await fetch('/api/movies');
      const movies = await res.json();
      body.innerHTML = '';
      for (const m of movies) {
        const tr = document.createElement('tr');
        for (const value of [m.id, m.title, m.genre, m.year]) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/movies', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('title').value,
          genre: document.getElementById('genre').value,
          year: document.getElementById('year').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) return showMessage(data.error, true);
      showMessage('Movie added successfully');
      loadMovies();
    });

    document.getElementById('load-btn').addEventListener('click', loadMovies);

    loadMovies();
  </script>
</body>
</html>
